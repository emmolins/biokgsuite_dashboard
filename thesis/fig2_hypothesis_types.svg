<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Six discovery hypothesis types as predicted KG edges</title>
  <desc>Entity nodes (drug, target/gene, disease, adverse phenotype, biomarker, variant) connected by six dashed predicted edges: repurposing, target identification, safety, combinations, effect-modifier, mechanism.</desc>
  <rect x="0" y="0" width="900" height="450" fill="#FFFFFF"/>
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker>
    <marker id="e2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#888780"/></marker>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2C2C2A">Six discovery hypotheses as predicted KG edges</text>
  <text x="450" y="45" text-anchor="middle" font-size="12" fill="#5F5E5A">dashed = a missing edge the knowledge graph predicts</text>
  <g stroke="#888780" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
    <path d="M300,232 L604,138" marker-end="url(#e)"/>
    <path d="M300,100 L604,128" marker-end="url(#e)"/>
    <path d="M300,244 L616,290" marker-end="url(#e)"/>
    <path d="M250,252 L318,286" marker-start="url(#e2)" marker-end="url(#e)"/>
    <path d="M205,252 L172,322" marker-end="url(#e)"/>
    <path d="M472,320 L616,150" marker-end="url(#e)"/>
    <path d="M258,248 L430,318" marker-end="url(#e)"/>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="452" cy="185" r="11" fill="#534AB7"/><text x="452" y="189" fill="#fff">1</text>
    <circle cx="452" cy="108" r="11" fill="#534AB7"/><text x="452" y="112" fill="#fff">2</text>
    <circle cx="455" cy="270" r="11" fill="#534AB7"/><text x="455" y="274" fill="#fff">3</text>
    <circle cx="284" cy="272" r="11" fill="#534AB7"/><text x="284" y="276" fill="#fff">4</text>
    <circle cx="182" cy="292" r="11" fill="#534AB7"/><text x="182" y="296" fill="#fff">5</text>
    <circle cx="548" cy="232" r="11" fill="#534AB7"/><text x="548" y="236" fill="#fff">6</text>
    <circle cx="352" cy="292" r="11" fill="#534AB7"/><text x="352" y="296" fill="#fff">6</text>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="196" y="82" width="112" height="34" rx="8" fill="#FBFAF6" stroke="#B4B2A9"/><text x="252" y="103" fill="#2C2C2A">Target / Gene</text>
    <rect x="604" y="112" width="104" height="34" rx="8" fill="#FBFAF6" stroke="#B4B2A9"/><text x="656" y="133" fill="#2C2C2A">Disease</text>
    <rect x="150" y="230" width="100" height="34" rx="8" fill="#FBFAF6" stroke="#B4B2A9"/><text x="200" y="251" fill="#2C2C2A">Drug A</text>
    <rect x="304" y="286" width="100" height="34" rx="8" fill="#FBFAF6" stroke="#B4B2A9"/><text x="354" y="307" fill="#2C2C2A">Drug B</text>
    <rect x="614" y="286" width="150" height="34" rx="8" fill="#FBFAF6" stroke="#B4B2A9"/><text x="689" y="307" fill="#2C2C2A">Adverse phenotype</text>
    <rect x="418" y="316" width="108" height="34" rx="8" fill="#FBFAF6" stroke="#B4B2A9"/><text x="472" y="337" fill="#2C2C2A">Biomarker</text>
    <rect x="96" y="322" width="152" height="34" rx="8" fill="#FBFAF6" stroke="#B4B2A9"/><text x="172" y="343" fill="#2C2C2A">Variant / comorbidity Z</text>
  </g>
  <g font-size="10.5" fill="#5F5E5A">
    <text x="60" y="392" font-weight="700" fill="#2C2C2A">1</text><text x="74" y="392" text-anchor="start">Drug &#8594; Disease &#183; repurposing</text>
    <text x="60" y="410" font-weight="700" fill="#2C2C2A">2</text><text x="74" y="410" text-anchor="start">Target &#8594; Disease &#183; target ID</text>
    <text x="60" y="428" font-weight="700" fill="#2C2C2A">3</text><text x="74" y="428" text-anchor="start">Drug &#8594; Adverse phenotype &#183; safety</text>
    <text x="480" y="392" font-weight="700" fill="#2C2C2A">4</text><text x="494" y="392" text-anchor="start">Drug &#8596; Drug &#183; combination</text>
    <text x="480" y="410" font-weight="700" fill="#2C2C2A">5</text><text x="494" y="410" text-anchor="start">Drug &#8594; variant/biomarker &#183; effect-modifier</text>
    <text x="480" y="428" font-weight="700" fill="#2C2C2A">6</text><text x="494" y="428" text-anchor="start">Gene/Biomarker &#8596; Disease &#183; mechanism</text>
  </g>
</svg>
